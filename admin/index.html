<!DOCTYPE html>
<html lang="en">
<head>

  <title>Console · Comwrap Reply</title>
  <style>
    :root { --accent: #01EB51; --bg: #000; --panel: #0B130E; --on: #000; --ink2: #C9D3CD; --muted: #86948C; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: #F2F5F3; font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    body { display: grid; place-items: center; padding: 24px; overflow-x: hidden; transition: background .4s; }
    .glow { position: fixed; inset: 0; background: radial-gradient(circle at 78% 20%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 45%), linear-gradient(135deg, transparent 55%, color-mix(in srgb, var(--accent) 16%, transparent) 70%, transparent 85%); pointer-events: none; }
    .orbit { position: fixed; right: -12vmin; bottom: -12vmin; width: 70vmin; height: 70vmin; border-radius: 50%; border: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent); animation: spin 60s linear infinite; pointer-events: none; }
    .orbit::before { content: ""; position: absolute; inset: 14%; border-radius: 50%; border: 1px solid rgba(242,245,243,.08); }
    .orbit::after { content: ""; position: absolute; top: 50%; left: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px var(--accent); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .box { position: relative; width: min(440px, 100%); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .22em; font-size: 15px; margin-bottom: 40px; }
    .brand span { color: var(--muted); font-weight: 400; letter-spacing: .18em; font-size: 12px; text-transform: uppercase; }
    .k { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 12px; }
    h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.04; margin: 0 0 14px; letter-spacing: -0.02em; }
    p { color: var(--ink2); line-height: 1.5; margin: 0 0 26px; font-size: 15px; }
    form { display: grid; gap: 12px; }
    label.f { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    input[type=password] { width: 100%; height: 52px; border-radius: 12px; border: 1px solid rgba(242,245,243,.18); background: var(--panel); color: #F2F5F3; font-size: 17px; padding: 0 16px; outline: none; }
    input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .rem { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); cursor: pointer; }
    .rem input { accent-color: var(--accent); }
    button { height: 50px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on); font-weight: 700; font-size: 15px; letter-spacing: .04em; cursor: pointer; padding: 0 26px; }
    button:disabled { opacity: .6; cursor: wait; }
    .err { min-height: 20px; color: #FF8B8B; font-size: 13.5px; }
    .lang { position: fixed; top: 20px; right: 20px; display: flex; gap: 4px; }
    .lang a { color: var(--muted); font-size: 12px; letter-spacing: .1em; text-decoration: none; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(242,245,243,.12); }
    .lang a.on { color: #000; background: #F2F5F3; }
    .brand svg.rl { width: 22px; height: 21px; color: var(--accent); }
    .brand svg.cw { height: 34px; width: auto; }
    .brand .rw { display: inline-flex; align-items: center; gap: 10px; color: #F2F5F3; font-weight: 700; font-size: 15px; letter-spacing: .22em; }
    @media (max-width: 420px) { .row { flex-direction: column; align-items: stretch; } .row button { width: 100%; } .brand { margin-bottom: 28px; } }
    .foot { margin-top: 34px; font-size: 11px; color: #5D6A63; letter-spacing: .06em; }
  </style>
</head>
